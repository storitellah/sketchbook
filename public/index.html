<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna &amp; Lara's Art Books</title>
  <meta name="description" content="Drawings and paintings by Luna and Lara, in a flipbook.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="gallery.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/page-flip.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1 class="brand"><img class="brand-mark" src="favicon.svg" alt="" width="40" height="40">Luna <span class="amp">&amp;</span> Lara</h1>
    <nav class="tabs" role="tablist" aria-label="Choose an art book"></nav>
  </header>

  <main class="stage" id="stage">
    <div class="book-host" id="book-host" role="region" aria-roledescription="flipbook" aria-label="Art book"></div>
  </main>

  <footer class="bar">
    <button class="nav-btn" id="prev" type="button" aria-label="Previous page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="progress">
      <span class="counter" id="counter" aria-live="polite"></span>
      <span class="track"><span class="fill" id="fill"></span></span>
    </div>
    <button class="nav-btn" id="next" type="button" aria-label="Next page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>
  <p class="foot-note" id="foot-note"></p>

  <dialog class="viewer" id="viewer" aria-label="Drawing">
    <form method="dialog"><button class="close" aria-label="Close">&times;</button></form>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
  </dialog>
</body>
</html>
