name: Sync artwork from Google Drive

on:
  schedule:
    # Backup only: GitHub often runs schedules hours late. The Cloudflare Worker
    # in worker/ starts this job every 10 minutes on time.
    - cron: "23 * * * *"
  workflow_dispatch: # "Run workflow" button, and how the Cloudflare Worker starts it

permissions:
  contents: write
  actions: write # for the keep-alive step below

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Always work on main, the branch Cloudflare publishes, whichever branch
      # the schedule happens to run from.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm ci

      # The folder comes from sketchbook.config.json; no key is needed for a
      # folder shared as "Anyone with the link".
      - name: Pull new artwork
        run: npm run sync

      - name: Commit changes
        run: |
          git add -A public
          if git diff --cached --quiet; then
            echo "No new artwork."
            exit 0
          fi
          git config user.name "sketchbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update artwork from Google Drive"
          git push origin HEAD:main

      # GitHub switches off scheduled workflows after 60 days without commits.
      # Re-enabling it on every run keeps it going during quiet spells.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable sync-drive.yml --repo "$GITHUB_REPOSITORY" || echo "Could not refresh the schedule"
